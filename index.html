<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Orb Lab</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="stage"></div>
    <div id="ui">
      <nav id="groups"></nav>
      <nav id="tabs"></nav>
      <nav id="card-styles" hidden></nav>
      <div id="controls">
        <button id="talk" class="primary">Talk to agent</button>
        <button id="sim">Sim convo</button>
        <button id="mic-only">Mic only</button>
        <button id="cards-mode" title="Experiment: the agent can bring up and dismiss cards">Voice cards</button>
      </div>
      <div id="keys">1–9 / ← → variant · space talk · S sim · H hud · G tuner · cards: C W L T, X clear</div>
    </div>
    <div id="toast"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
