<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Orb Lab</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="stage"></div>
    <nav id="panel-toggles">
      <button id="readings-btn" title="Live signal readings (H)">Readings</button>
      <button id="tune-btn" title="Shape, response and colour controls (G)">Tune</button>
    </nav>
    <div id="ui">
      <div id="pickers">
        <label class="pick"><span>Orb</span><select id="orb-select"></select></label>
        <label class="pick"><span>Behaviour</span><select id="behaviour-select"></select></label>
        <label class="pick"><span>Experiment</span><select id="exp-select">
          <option value="talk">Just talk</option>
          <option value="cards">Voice cards</option>
        </select></label>
        <label class="pick" id="cardstyle-pick" hidden><span>Cards appear by</span><select id="cardstyle-select"></select></label>
      </div>
      <div id="controls">
        <button id="talk" class="primary">Talk to agent</button>
        <button id="sim">Sim convo</button>
        <button id="mic-only">Mic only</button>
      </div>
      <div id="keys">← → orb · space talk · S sim · H readings · G tune · cards: C W L T, X clear</div>
    </div>
    <div id="toast"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
